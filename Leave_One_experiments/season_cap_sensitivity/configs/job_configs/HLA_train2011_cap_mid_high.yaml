seed: 0
training:
  total_timesteps: 5000
  stations_in_order:
  - HLA
  - SYA
  - LCA
  - FQA
  - YCA
  stop_on_quality_gate_failure: true
  best_train_years:
    HLA: 2011
    SYA: 2012
    LCA: 2010
    FQA: 2010
    YCA: 2008
  cv_types:
    HLA: observed_year_leave_one
    SYA: observed_year_leave_one
    LCA: observed_year_leave_one
    FQA: limited_two_year_cross_validation
    YCA: limited_two_year_cross_validation
  active_cap_name: cap_mid_high
cap_levels:
- cap_name: cap_low
  season_irrigation_cap: 100.0
  season_n_cap: 150.0
- cap_name: cap_mid_low
  season_irrigation_cap: 150.0
  season_n_cap: 225.0
- cap_name: cap_current
  season_irrigation_cap: 200.0
  season_n_cap: 300.0
- cap_name: cap_mid_high
  season_irrigation_cap: 250.0
  season_n_cap: 375.0
- cap_name: cap_high
  season_irrigation_cap: 300.0
  season_n_cap: 450.0
debug:
  enabled: false
  ppo_overrides:
    learning_rate: 0.0003
    gamma: 0.99
    n_steps: 128
    batch_size: 64
    ent_coef: 0.0
    clip_range: 0.2
ppo:
  total_timesteps_full: 5000
  learning_rate: null
  gamma: null
  n_steps: null
  batch_size: null
  ent_coef: null
  clip_range: null
paths:
  output_root: Leave_One_experiments/season_cap_sensitivity
  weather_dir: weather_clean_qc
  wth_dir: Leave_One_experiments/wth_generated_qc
  my_data_dir: my_data
  cultivar_file: my_data/MZCER048.CUL
safety:
  run_pretrain_smoke_check: true
  do_not_overwrite_raw_inputs: true
  batch_training_disabled_by_default: false
action_safety:
  enabled: true
  daily_irrigation_max: 40.0
  daily_n_max: 80.0
  season_irrigation_soft_limit: 250.0
  season_n_soft_limit: 375.0
  min_days_between_irrigation: 7
  min_days_between_fertilization: 10
  fertilization_allowed_dap_range:
  - 1
  - 90
  irrigation_allowed_dap_range:
  - 1
  - 120
quality_gates:
  require_run_status_ok: true
  require_episode_completed: true
  require_daily_csv: true
  cap_tolerance: 1.0e-06
  required_figures:
  - dap_swfac_irrigation_reward.png
  - dap_nstres_fertilization_reward.png
  - crop_growth_timeseries.png
  - cumulative_water_nitrogen.png
  - daily_actions.png
  - daily_actions_raw_vs_safe.png
  - action_safety_triggers.png
runtime:
  max_steps: 260
  episode_timeout_seconds: 300
  mode: all
