seed: 0

paths:
  output_root: Leave_One_experiments/constrained_ppo_multiseed_augmented_prior
  augmented_prior_root: Leave_One_experiments/expert_dataset_augmentation
  weather_dir: weather_clean_qc
  wth_dir: Leave_One_experiments/wth_generated_qc
  my_data_dir: my_data
  cultivar_file: my_data/MZCER048.CUL

runtime:
  mode: all
  max_steps: 260
  timesteps: 5000
  seeds: [0, 1, 2]
  seed_plan_note: "Use [0,1,2] first to control DSSAT/PPO runtime; expand to [3,4] only if this batch is stable."

ppo:
  learning_rate: 0.0003
  gamma: 0.99
  n_steps: 256
  batch_size: 64
  ent_coef: 0.0
  clip_range: 0.2

economics:
  grain_value_coef: 0.01
  water_cost: 0.5
  n_cost: 0.25

ppo_reference:
  mean_yield: 6875.87158203125
  total_irrigation: 300.0
  total_n: 450.0
  source: Leave_One_experiments/budget_action_design_debug/evaluation/budget_action_design_candidate_comparison.csv

prior_policy:
  name: BC_random_forest_regressor_augmented
  action_table: Leave_One_experiments/expert_dataset_augmentation/evaluation/policy_action_tables/BC_random_forest_regressor_augmented_action_table.csv
  baseline_summary: Leave_One_experiments/expert_dataset_augmentation/evaluation/augmented_imitation_policy_dssat_summary.csv
  recommended_policy: Leave_One_experiments/expert_dataset_augmentation/evaluation/recommended_augmented_prior_policy.csv

action_safety:
  enabled: true
  daily_irrigation_max: 40.0
  daily_n_max: 80.0
  season_irrigation_soft_limit: 100.0
  season_n_soft_limit: 200.0
  min_days_between_irrigation: 7
  min_days_between_fertilization: 10
  fertilization_allowed_dap_range: [1, 120]
  irrigation_allowed_dap_range: [1, 120]

methods:
  - name: MS0_augmented_RF_prior_replay
    train: false
    type: prior_replay
  - name: MS1_residual_augmented_RF_prior_strict
    train: true
    type: residual
    irrigation_residual_range: 10.0
    n_residual_range: 20.0
    reward_version: P2_terminal_profit_medium_cost
  - name: MS2_guardrail_augmented_RF_100_200
    train: true
    type: imitation_penalty
    lambda_bc: 1.0
    reward_version: P2_terminal_profit_medium_cost

sites:
  HLA:
    train_year: 2011
    eval_years: [2011, 2007, 2009]
  SYA:
    train_year: 2012
    eval_years: [2012, 2014, 2015]
  LCA:
    train_year: 2010
    eval_years: [2010, 2011, 2008, 2009]

observed_years:
  HLA:
    - year: 2007
      label: observed_low_rain_year
      planting_date: "2007-05-05"
      harvest_window_rain_mm: 345.6
    - year: 2011
      label: observed_mid_rain_year
      planting_date: "2011-05-05"
      harvest_window_rain_mm: 479.2
    - year: 2009
      label: observed_high_rain_year
      planting_date: "2009-05-02"
      harvest_window_rain_mm: 489.5
  SYA:
    - year: 2014
      label: observed_low_rain_year
      planting_date: "2014-04-21"
      harvest_window_rain_mm: 331.8
    - year: 2015
      label: observed_mid_rain_year
      planting_date: "2015-04-18"
      harvest_window_rain_mm: 424.1
    - year: 2012
      label: observed_high_rain_year
      planting_date: "2012-04-28"
      harvest_window_rain_mm: 649.4
  LCA:
    - year: 2010
      label: observed_low_rain_year
      planting_date: "2010-06-06"
      harvest_window_rain_mm: 288.5
    - year: 2011
      label: observed_mid_rain_year
      planting_date: "2011-06-15"
      harvest_window_rain_mm: 300.9
    - year: 2008
      label: observed_high_rain_year
      planting_date: "2008-06-19"
      harvest_window_rain_mm: 473.4
    - year: 2009
      label: observed_extra_validation_year
      planting_date: "2009-06-14"
      harvest_window_rain_mm: 370.7
