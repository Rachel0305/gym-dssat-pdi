seed: 0

paths:
  output_root: Leave_One_experiments/expert_dataset_augmentation
  offline_root: Leave_One_experiments/offline_schedule_search
  prior_replay_root: Leave_One_experiments/prior_replay_debug
  imitation_prior_root: Leave_One_experiments/imitation_learning_prior
  weather_dir: weather_clean_qc
  wth_dir: Leave_One_experiments/wth_generated_qc
  my_data_dir: my_data
  cultivar_file: my_data/MZCER048.CUL

runtime:
  mode: all
  max_steps: 260
  evaluate_dssat: true

economics:
  grain_value_coef: 0.01
  water_cost: 0.5
  n_cost: 0.25

ppo_reference:
  mean_yield: 6875.87158203125
  total_irrigation: 300.0
  total_n: 450.0
  source: Leave_One_experiments/budget_action_design_debug/evaluation/budget_action_design_candidate_comparison.csv

action_postprocess:
  event_threshold: 25.0
  max_irrigation: 100.0
  max_n: 150.0

action_safety:
  enabled: true
  daily_irrigation_max: 100.0
  daily_n_max: 150.0
  season_irrigation_soft_limit: 300.0
  season_n_soft_limit: 450.0
  min_days_between_irrigation: 7
  min_days_between_fertilization: 10
  fertilization_allowed_dap_range: [1, 120]
  irrigation_allowed_dap_range: [1, 120]

augmentation:
  stations: [HLA, SYA, LCA]
  max_schedules_per_station: 20
  category_top_n: 5
  include_top_profit_even_if_yield_loss_high: true
  expert_rankings:
    HLA: Leave_One_experiments/offline_schedule_search/expert_policy/HLA_expert_schedule_ranking.csv
    SYA: Leave_One_experiments/offline_schedule_search/expert_policy/SYA_expert_schedule_ranking.csv
    LCA: Leave_One_experiments/offline_schedule_search/expert_policy/LCA_expert_schedule_ranking.csv
  cross_year_summaries:
    HLA: Leave_One_experiments/offline_schedule_search/evaluation/HLA_top_schedule_cross_year_summary.csv
    SYA: Leave_One_experiments/offline_schedule_search/evaluation/SYA_top_schedule_cross_year_summary.csv
    LCA: Leave_One_experiments/offline_schedule_search/evaluation/LCA_top_schedule_cross_year_summary.csv
  train_years:
    HLA: 2011
    SYA: 2012
    LCA: 2010
  validation_years:
    HLA: [2007, 2009]
    SYA: [2014, 2015]
    LCA: [2008, 2009, 2011]
  evaluation_years:
    HLA: [2011, 2007, 2009]
    SYA: [2012, 2014, 2015]
    LCA: [2010, 2011, 2008, 2009]

observed_years:
  HLA:
    - year: 2007
      label: observed_low_rain_year
      planting_date: "2007-05-05"
      harvest_window_rain_mm: 345.6
    - year: 2011
      label: observed_mid_rain_year
      planting_date: "2011-05-05"
      harvest_window_rain_mm: 479.2
    - year: 2009
      label: observed_high_rain_year
      planting_date: "2009-05-02"
      harvest_window_rain_mm: 489.5
  SYA:
    - year: 2014
      label: observed_low_rain_year
      planting_date: "2014-04-21"
      harvest_window_rain_mm: 331.8
    - year: 2015
      label: observed_mid_rain_year
      planting_date: "2015-04-18"
      harvest_window_rain_mm: 424.1
    - year: 2012
      label: observed_high_rain_year
      planting_date: "2012-04-28"
      harvest_window_rain_mm: 649.4
  LCA:
    - year: 2010
      label: observed_low_rain_year
      planting_date: "2010-06-06"
      harvest_window_rain_mm: 288.5
    - year: 2011
      label: observed_mid_rain_year
      planting_date: "2011-06-15"
      harvest_window_rain_mm: 300.9
    - year: 2008
      label: observed_high_rain_year
      planting_date: "2008-06-19"
      harvest_window_rain_mm: 473.4
    - year: 2009
      label: observed_extra_validation_year
      planting_date: "2009-06-14"
      harvest_window_rain_mm: 370.7
