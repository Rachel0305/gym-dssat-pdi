seed: 0

paths:
  output_root: Leave_One_experiments/offline_schedule_search
  weather_dir: weather_clean_qc
  wth_dir: Leave_One_experiments/wth_generated_qc
  my_data_dir: my_data
  cultivar_file: my_data/MZCER048.CUL

runtime:
  mode: all
  max_steps: 260
  max_hla_schedules: null

offline_search:
  station: HLA
  train_year: 2011
  eval_years: [2011, 2007, 2009]
  grid:
    nitrogen_amounts: [0, 75, 150]
    irrigation_amounts: [0, 50, 100]
    conservative_n_cap: 300.0
    conservative_irrigation_cap: 250.0
  nitrogen_events:
    - {name: N1, dap: 1}
    - {name: N2, dap: 30}
    - {name: N3, dap: 60}
  irrigation_events:
    - {name: I1, dap: 25}
    - {name: I2, dap: 50}
    - {name: I3, dap: 75}
  economics:
    grain_value_coef: 0.01
    water_cost: 0.5
    n_cost: 0.25
  ppo_reference:
    mean_yield: 6875.87158203125
    total_irrigation: 300.0
    total_n: 450.0
    source: Leave_One_experiments/budget_action_design_debug/evaluation/budget_action_design_candidate_comparison.csv
  top_selection:
    top_n_each: 5
    max_unique_schedules: 20
    low_input_yield_loss_threshold: 0.10
  extension_gate:
    mean_yield_loss_vs_ppo_baseline: 0.10
    mean_irrigation_max: 250.0
    mean_n_max: 300.0

extension_sites:
  SYA:
    train_year: 2012
    eval_years: [2012, 2014, 2015]
  LCA:
    train_year: 2010
    eval_years: [2010, 2011, 2008, 2009]

action_safety:
  enabled: true
  daily_irrigation_max: 100.0
  daily_n_max: 150.0
  season_irrigation_soft_limit: 300.0
  season_n_soft_limit: 450.0
  min_days_between_irrigation: 7
  min_days_between_fertilization: 10
  fertilization_allowed_dap_range: [1, 120]
  irrigation_allowed_dap_range: [1, 120]

observed_years:
  HLA:
    - year: 2007
      label: observed_low_rain_year
      planting_date: "2007-05-05"
      harvest_window_rain_mm: 345.6
    - year: 2011
      label: observed_mid_rain_year
      planting_date: "2011-05-05"
      harvest_window_rain_mm: 479.2
    - year: 2009
      label: observed_high_rain_year
      planting_date: "2009-05-02"
      harvest_window_rain_mm: 489.5
  SYA:
    - year: 2014
      label: observed_low_rain_year
      planting_date: "2014-04-21"
      harvest_window_rain_mm: 331.8
    - year: 2015
      label: observed_mid_rain_year
      planting_date: "2015-04-18"
      harvest_window_rain_mm: 424.1
    - year: 2012
      label: observed_high_rain_year
      planting_date: "2012-04-28"
      harvest_window_rain_mm: 649.4
  LCA:
    - year: 2010
      label: observed_low_rain_year
      planting_date: "2010-06-06"
      harvest_window_rain_mm: 288.5
    - year: 2011
      label: observed_mid_rain_year
      planting_date: "2011-06-15"
      harvest_window_rain_mm: 300.9
    - year: 2008
      label: observed_intermediate_rain_year_3
      planting_date: "2008-06-19"
      harvest_window_rain_mm: 357.1
    - year: 2009
      label: observed_high_rain_year
      planting_date: "2009-06-14"
      harvest_window_rain_mm: 417.1
